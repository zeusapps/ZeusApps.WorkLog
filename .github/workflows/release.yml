name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Package matching version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected vMAJOR.MINOR.PATCH tag' }
          ./scripts/package.ps1 -Version $env:RELEASE_TAG.Substring(1)
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release create $env:RELEASE_TAG "artifacts/releases/worklog-$version-win-x64.zip" "artifacts/releases/worklog-$version-win-x64.zip.sha256" --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
